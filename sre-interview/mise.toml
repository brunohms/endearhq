[tools]
terraform = "1.16.3"
helm = "4.3.0"
helmfile = "1.8.0"
kind = "0.31.0"
kubectl = "1.35.8"

[env]
KUBECONFIG = "{{config_root}}/terraform/.kubeconfig"

[tasks.cluster]
description = "Create the kind cluster with Terraform"
dir = "{{config_root}}/terraform"
run = ["terraform init -input=false", "terraform apply -input=false -auto-approve"]

[tasks.deploy]
description = "Deploy every Helm release with helmfile"
dir = "{{config_root}}/deploy"
run = "helmfile sync"

[tasks.images]
description = "Build the app images and load them into the kind node"
dir = "{{config_root}}/app"
run = [
  "docker build -f Dockerfile.node --build-arg PACKAGE=backend -t sre-interview/backend:dev .",
  "docker build -f Dockerfile.node --build-arg PACKAGE=worker -t sre-interview/worker:dev .",
  "docker build -f Dockerfile.node --build-arg PACKAGE=simulator -t sre-interview/simulator:dev .",
  "docker build -f Dockerfile.frontend -t sre-interview/frontend:dev .",
  "kind load docker-image sre-interview/backend:dev sre-interview/worker:dev sre-interview/simulator:dev sre-interview/frontend:dev --name sre-interview",
  "kubectl -n app rollout restart deploy/backend deploy/worker deploy/simulator deploy/frontend 2>/dev/null || true",
]

[tasks.up]
description = "Create the cluster and deploy everything onto it"
run = ["mise run cluster", "mise run images", "mise run deploy", "kubectl get pods -A"]

[tasks.down]
description = "Destroy the cluster, and everything on it with it"
dir = "{{config_root}}/terraform"
run = "terraform destroy -input=false -auto-approve"

[tasks.psql]
description = "Open a psql shell inside the Postgres pod"
run = "kubectl -n postgres exec -it postgres-0 -- sh -c 'psql -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"'"
