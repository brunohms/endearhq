apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickstack.fullname" . }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: app
      port: {{ .Values.service.appPort }}
      targetPort: app
      {{- if and (eq .Values.service.type "NodePort") .Values.service.appNodePort }}
      nodePort: {{ .Values.service.appNodePort }}
      {{- end }}
    - name: otlp-grpc
      port: {{ .Values.service.otlpGrpcPort }}
      targetPort: otlp-grpc
    - name: otlp-http
      port: {{ .Values.service.otlpHttpPort }}
      targetPort: otlp-http
    - name: clickhouse
      port: {{ .Values.service.clickhousePort }}
      targetPort: clickhouse
  selector:
    {{- include "clickstack.selectorLabels" . | nindent 4 }}
