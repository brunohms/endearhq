apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickstack.fullname" . }}
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "clickstack.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "clickstack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clickstack.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/clickhouse-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: clickstack
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_OPTIONS
              value: {{ .Values.nodeOptions | quote }}
          ports:
            - name: app
              containerPort: 8080
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: clickhouse
              containerPort: 8123
          startupProbe:
            httpGet:
              path: /api/health
              port: app
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: app
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: app
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: mongodb-data
              mountPath: /data/db
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/config.d/zz-limits.xml
              subPath: zz-limits.xml
              readOnly: true
      volumes:
        - name: clickhouse-config
          configMap:
            name: {{ include "clickstack.fullname" . }}-clickhouse
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.clickhouseSize }}
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.mongodbSize }}
