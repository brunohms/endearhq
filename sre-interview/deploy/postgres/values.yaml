image:
  repository: postgres
  tag: "18.6"
  pullPolicy: IfNotPresent

auth:
  database: app
  username: app
  password: password

postgresqlParameters:
  shared_buffers: "32MB"
  max_connections: "50"
  log_line_prefix: "%m [%p] %q%u@%d "
  log_connections: "on"
  log_disconnections: "on"
  log_checkpoints: "on"
  log_autovacuum_min_duration: "0"
  log_min_duration_statement: "500"

service:
  port: 5432

persistence:
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
