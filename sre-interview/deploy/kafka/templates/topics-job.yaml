{{- if or .Values.topics .Values.consumerGroups }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kafka.fullname" . }}-setup
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx128m -Xms32m"
          command:
            - /bin/sh
            - -ec
            - |
              BS={{ include "kafka.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}
              TOPICS=/opt/kafka/bin/kafka-topics.sh
              GROUPS=/opt/kafka/bin/kafka-consumer-groups.sh

              until "$TOPICS" --bootstrap-server "$BS" --list >/dev/null 2>&1; do
                echo "waiting for $BS"
                sleep 3
              done
              echo "broker is up"

              {{- range .Values.topics }}
              "$TOPICS" --bootstrap-server "$BS" --create --if-not-exists \
                --topic {{ .name | quote }} \
                --partitions {{ .partitions | default 1 }} \
                --replication-factor {{ .replicationFactor | default 1 }}
              echo "topic {{ .name }} ready"
              {{- end }}

              {{- range .Values.consumerGroups }}
              if "$GROUPS" --bootstrap-server "$BS" --list 2>/dev/null | grep -qx {{ .name | quote }}; then
                echo "group {{ .name }} already exists, leaving its offsets alone"
              else
                "$GROUPS" --bootstrap-server "$BS" \
                  --group {{ .name | quote }} --topic {{ .topic | quote }} \
                  --reset-offsets --to-{{ .offset | default "earliest" }} --execute
                echo "group {{ .name }} seeded at {{ .offset | default "earliest" }}"
              fi
              {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
{{- end }}
